<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Python Conditions &amp; Loops</title>
  <desc id="d">Banner for the Student Scholarship Eligibility and Pharmacy Inventory Management Python projects</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="0.6" stop-color="#065f46"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bef264"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#052e22"/>
      <stop offset="1" stop-color="#01160f"/>
    </linearGradient>
    <pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(0.9)">
      <path d="M28 0 L56 16 V48 L28 64 L0 48 V16 Z M28 64 V97 M0 48 L-28 64 M56 48 L84 64" fill="none" stroke="#a7f3d0" stroke-opacity="0.07" stroke-width="1.2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#hex)"/>
  <circle cx="1180" cy="20" r="210" fill="#bef264" fill-opacity="0.07"/>
  <circle cx="640" cy="390" r="190" fill="#34d399" fill-opacity="0.08"/>
  <rect x="0" y="352" width="1280" height="8" fill="url(#accent)"/>

  <!-- Left: text block -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="70" y="62" width="6" height="22" rx="3" fill="url(#accent)"/>
    <text x="88" y="80" font-size="16" font-weight="700" letter-spacing="3.5" fill="#bef264">PYTHON  ·  CONSOLE APPLICATIONS</text>
    <text x="70" y="150" font-size="62" font-weight="800" fill="#ffffff">Python Conditions</text>
    <text x="70" y="216" font-size="62" font-weight="800" fill="url(#accent)">&amp; Loops</text>
    <rect x="70" y="234" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="70" y="278" font-size="21" fill="#d1fae5">Scholarship Eligibility System  •  Pharmacy Inventory Manager</text>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ecfdf5">
    <rect x="70" y="300" width="128" height="32" rx="16" fill="#022c22" fill-opacity="0.55" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="134" y="321" text-anchor="middle">Conditions</text>
    <rect x="208" y="300" width="96" height="32" rx="16" fill="#022c22" fill-opacity="0.55" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="256" y="321" text-anchor="middle">Loops</text>
    <rect x="314" y="300" width="128" height="32" rx="16" fill="#022c22" fill-opacity="0.55" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="378" y="321" text-anchor="middle">Validation</text>
    <rect x="452" y="300" width="150" height="32" rx="16" fill="#022c22" fill-opacity="0.55" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="527" y="321" text-anchor="middle">Error Handling</text>
  </g>

  <!-- Right: terminal window -->
  <g filter="url(#shadow)">
    <rect x="790" y="46" width="420" height="238" rx="14" fill="url(#win)" stroke="#34d399" stroke-opacity="0.5"/>
  </g>
  <path d="M790 60 a14 14 0 0 1 14 -14 H1196 a14 14 0 0 1 14 14 V82 H790 Z" fill="#064e3b"/>
  <circle cx="814" cy="64" r="6" fill="#f87171"/>
  <circle cx="834" cy="64" r="6" fill="#fbbf24"/>
  <circle cx="854" cy="64" r="6" fill="#4ade80"/>
  <text x="1000" y="69" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#a7f3d0" fill-opacity="0.8">main.py</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="15">
    <text x="812" y="116"><tspan fill="#bef264">if</tspan><tspan fill="#ecfdf5"> marks </tspan><tspan fill="#34d399">&gt;=</tspan><tspan fill="#fde68a"> 80</tspan><tspan fill="#bef264"> and</tspan><tspan fill="#ecfdf5"> attendance </tspan><tspan fill="#34d399">&gt;=</tspan><tspan fill="#fde68a"> 85</tspan><tspan fill="#ecfdf5">:</tspan></text>
    <text x="812" y="142"><tspan fill="#ecfdf5">    award = </tspan><tspan fill="#6ee7b7">"Scholarship"</tspan></text>
    <text x="812" y="178"><tspan fill="#bef264">for</tspan><tspan fill="#ecfdf5"> medicine </tspan><tspan fill="#bef264">in</tspan><tspan fill="#ecfdf5"> range(n):</tspan></text>
    <text x="812" y="204"><tspan fill="#ecfdf5">    revenue </tspan><tspan fill="#34d399">+=</tspan><tspan fill="#ecfdf5"> sales_amount</tspan></text>
    <text x="812" y="240"><tspan fill="#bef264">while</tspan><tspan fill="#fde68a"> True</tspan><tspan fill="#ecfdf5">:</tspan></text>
    <text x="812" y="266"><tspan fill="#ecfdf5">    </tspan><tspan fill="#bef264">try</tspan><tspan fill="#ecfdf5">: value = float(input())</tspan></text>
  </g>

  <!-- Floating status chips -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" filter="url(#shadow)">
    <g transform="translate(1040,24)">
      <rect width="150" height="34" rx="17" fill="#bef264"/>
      <circle cx="20" cy="17" r="9" fill="#14532d"/>
      <path d="M15.5 17.2 L19 20.6 L24.8 14" fill="none" stroke="#bef264" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="22" fill="#14532d">Eligible</text>
    </g>
    <g transform="translate(980,262)">
      <rect width="190" height="34" rx="17" fill="#ecfdf5"/>
      <circle cx="20" cy="17" r="9" fill="#047857"/>
      <rect x="18.8" y="11" width="2.4" height="7.5" rx="1.2" fill="#ecfdf5"/>
      <circle cx="20" cy="21.5" r="1.4" fill="#ecfdf5"/>
      <text x="38" y="22" fill="#064e3b">Restock needed</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
